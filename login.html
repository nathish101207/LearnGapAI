<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LearnGap AI - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>LearnGap AI</h1>

    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
    </nav>
</header>

<div class="container">

    <h1>👋 Welcome to LearnGap AI</h1>

    <p>Enter your details to start learning.</p>

    <form action="/login" method="POST">

        <div class="question">

            <h3>Student Name</h3>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>

        <div class="question">

            <h3>Email</h3>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <button type="submit" class="button">
            🚀 Login
        </button>

    </form>

</div>

</body>
</html>
